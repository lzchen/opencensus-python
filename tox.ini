[tox]
envlist = py{2.7,3.4,3.5,3.6}-unit
 
[testenv]
deps = 
  mock
  pytest
  pytest-cov
  retrying
  unittest2
  context/opencensus-context
  contrib/opencensus-correlation
  contrib/opencensus-ext-azure
  contrib/opencensus-ext-dbapi
  contrib/opencensus-ext-django
  contrib/opencensus-ext-flask
  contrib/opencensus-ext-gevent
  contrib/opencensus-ext-grpc
  contrib/opencensus-ext-httplib
  contrib/opencensus-ext-jaeger
  contrib/opencensus-ext-mysql
  contrib/opencensus-ext-ocagent
  contrib/opencensus-ext-postgresql
  contrib/opencensus-ext-prometheus
  contrib/opencensus-ext-pymongo
  contrib/opencensus-ext-pymysql
  contrib/opencensus-ext-pyramid
  contrib/opencensus-ext-requests
  contrib/opencensus-ext-sqlalchemy
  contrib/opencensus-ext-stackdriver
  contrib/opencensus-ext-threading
  contrib/opencensus-ext-zipkin
  contrib/opencensus-ext-google-cloud-clientlibs

commands =
  unit: py.test --quiet --cov=opencensus --cov=context --cov=contrib --cov-append --cov-report= --cov-config=.coveragerc --cov-fail-under=97 tests/unit/ context/ contrib/